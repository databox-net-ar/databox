name: databox

services:
  databox:
    container_name: databox-apache
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8091:8091"
      - "8113:8113"
      - "8094:8094"
      - "8114:8114"
    volumes:
      - ./cloud:/var/www/html
      # Segundo mount de la misma carpeta cloud en /var/www/cloud para que las
      # APIs expuestas bajo /var/www/api/v4/... puedan hacer `require_once` de
      # librerias compartidas del panel via `dirname(__DIR__, 3) . '/cloud/...'`
      # sin acoplar el codigo PHP al DocumentRoot del panel (/var/www/html).
      # Toda API v4 nueva que necesite compartir logica con el panel cloud
      # (encoladores, motores, sanitizadores) resuelve el include por aca.
      - ./cloud:/var/www/cloud
      - ./www:/var/www/www
      - ./robot:/var/www/robot
      - ./api:/var/www/api
      - ./env.php:/var/www/env.php:ro
      - ./.env.development:/var/www/.env.development:ro
      # Montamos el .env.production tambien en desarrollo (read-only) para que
      # el Sincronizador de tablas pueda abrir una segunda conexion contra RDS
      # sin cambiar APP_ENV. Solo se usa desde ese endpoint; el loader normal
      # (env.php) sigue eligiendo development por la regla de deteccion.
      - ./.env.production:/var/www/.env.production:ro
      # Crontab del worker (tareas programadas contra /var/www/robot/*.php).
      # El entrypoint le ajusta permisos al arrancar para que cron lo acepte
      # y para que el endpoint del panel (que corre como www-data) pueda
      # re-escribirlo desde el "Editor de cron" en Herramientas.
      - ./robot/crontab:/etc/cron.d/databox
      # Crontab del "Programador de tareas" del panel cloud (scheduler
      # minutal + cleanup + rotacion). Estatico — las tareas concretas
      # viven en la tabla `tareas`. Se monta en una ruta neutra y el
      # entrypoint lo COPIA a /etc/cron.d/databox-cloud como root:root 644
      # — Docker no permite chown sobre un bind mount desde adentro del
      # contenedor, entonces si lo montaramos directo en /etc/cron.d/ cron
      # lo rechaza tarde o temprano por ownership no-root (uid del host).
      - ./cloud/jobs/crontab:/opt/databox/crontab_cloud_source:ro
      # Certificados mTLS para API Kite (Movistar). Carpeta gitignored;
      # cada host mantiene su propio movistar.pfx. Ver KITE_CERT_PATH/KITE_KEY_PATH en .env.
      - ./certs:/var/www/certs
    environment:
      APP_ENV: development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
